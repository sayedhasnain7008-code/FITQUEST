<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FITQUEST – Smart Student Fitness & Activity Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:inherit}
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --font-display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --font-body:'Figtree','Segoe UI',system-ui,-apple-system,sans-serif;
  --bg:#F3F5FB;--surface:#FFFFFF;--surface2:#EAEEF9;--ink:#0F1535;--ink2:#4A5478;--line:#DDE2F1;
  --primary:#3B4BFF;--primary-soft:#E3E6FF;--on-primary:#FFFFFF;
  --sun:#FFB800;--sun-soft:#FFF1CC;--flame:#FF6B3D;--flame-soft:#FFE6DC;
  --mint:#0FA57A;--mint-soft:#D9F6EA;--rose:#D93B46;--rose-soft:#FDE4E6;
  --shadow:0 1px 2px rgba(15,21,53,.06),0 10px 28px -14px rgba(15,21,53,.22);
  --r-lg:28px;--r-md:18px;--r-sm:12px;
  color-scheme:light;
}         
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B0F22;--surface:#141A36;--surface2:#1D2449;--ink:#EAEEFF;--ink2:#A3ADD6;--line:#2A3363;
    --primary:#7482FF;--primary-soft:#232B63;--on-primary:#0B0F22;
    --sun-soft:#3A2F10;--flame-soft:#3D2218;--mint:#33D6A6;--mint-soft:#0F3A30;--rose:#FF7A83;--rose-soft:#3F1B20;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.6);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B0F22;--surface:#141A36;--surface2:#1D2449;--ink:#EAEEFF;--ink2:#A3ADD6;--line:#2A3363;
  --primary:#7482FF;--primary-soft:#232B63;--on-primary:#0B0F22;
  --sun-soft:#3A2F10;--flame-soft:#3D2218;--mint:#33D6A6;--mint-soft:#0F3A30;--rose:#FF7A83;--rose-soft:#3F1B20;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.6);color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--font-body);-webkit-font-smoothing:antialiased;min-height:100vh}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;letter-spacing:-.025em;line-height:1.08}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary)}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:8px}
.skip{position:absolute;left:-999px;top:8px;background:var(--primary);color:var(--on-primary);padding:8px 14px;border-radius:8px;z-index:200}
.skip:focus{left:8px}
.ic{flex:none}
.muted{color:var(--ink2)}
.small{font-size:13.5px}
.tiny{font-size:12px}
.row{display:flex;align-items:center;gap:12px}
.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.center{text-align:center}
.hidden{display:none!important}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:999px;border:1.5px solid transparent;font-weight:650;font-size:15px;background:var(--surface2);color:var(--ink);transition:transform .15s,filter .15s,background .15s;text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(.97)}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-sun{background:var(--sun);color:#1c1500}
.btn-mint{background:var(--mint);color:#04140e}
.btn-line{background:transparent;border-color:var(--line)}
.btn-sm{min-height:38px;padding:0 15px;font-size:13.5px}
.btn-lg{min-height:58px;padding:0 32px;font-size:17px}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;position:relative}
.iconbtn .dot{position:absolute;top:9px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--flame);border:2px solid var(--surface)}
.link{background:none;border:0;padding:0;color:var(--primary);font-weight:650;text-decoration:underline;text-underline-offset:3px}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card.sm{border-radius:var(--r-md);padding:16px}
.card h3{font-size:19px;margin-bottom:4px}
.tile{background:var(--surface2);border-radius:var(--r-md);padding:14px 16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:650;background:var(--surface2);color:var(--ink2)}
.pill.primary{background:var(--primary-soft);color:var(--primary)}
.pill.sun{background:var(--sun-soft);color:#8a6200}
.pill.mint{background:var(--mint-soft);color:var(--mint)}
.pill.flame{background:var(--flame-soft);color:var(--flame)}
.pill.rose{background:var(--rose-soft);color:var(--rose)}
:root[data-theme="dark"] .pill.sun{color:var(--sun)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill.sun{color:var(--sun)}}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;min-height:40px;padding:0 16px;font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--primary);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.bar.mint>i{background:var(--mint)}.bar.sun>i{background:var(--sun)}.bar.flame>i{background:var(--flame)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:650;font-size:14px}
.field input,.field select,.field textarea{min-height:48px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);padding:0 14px}
.field textarea{padding:12px 14px;min-height:80px}
.field .hint{font-size:12.5px;color:var(--ink2)}
.seg{display:inline-flex;background:var(--surface2);border-radius:999px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;min-height:38px;padding:0 16px;border-radius:999px;font-weight:650;font-size:14px;color:var(--ink2)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.sw{width:52px;height:30px;border-radius:99px;border:0;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw[aria-checked="true"]{background:var(--mint)}
.sw[aria-checked="true"]::after{transform:translateX(22px)}
.notice{border-radius:var(--r-md);padding:14px 16px;background:var(--sun-soft);display:flex;gap:12px;align-items:flex-start;font-size:14px}
.notice.mint{background:var(--mint-soft)}
.notice.primary{background:var(--primary-soft)}
.empty{border:2px dashed var(--line);border-radius:var(--r-md);padding:26px;text-align:center;color:var(--ink2)}

/* rings & charts */
.ringw{position:relative;flex:none}
.ringw svg{display:block}
.rin{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.rfill{animation:ringin .9s cubic-bezier(.2,.8,.2,1)}
@keyframes ringin{from{stroke-dashoffset:var(--c)}}
.bars{display:flex;align-items:flex-end;gap:8px;height:calc(var(--h,120px) + 44px);padding-top:6px}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;min-width:0}
.bbar{width:100%;max-width:34px;border-radius:10px 10px 4px 4px;background:var(--primary-soft);transform-origin:bottom;animation:grow .7s cubic-bezier(.2,.8,.2,1)}
.bcol.hi .bbar{background:var(--primary)}
.bval{font-size:11px;color:var(--ink2);font-weight:650;min-height:14px}
.blab{font-size:11.5px;color:var(--ink2)}
@keyframes grow{from{transform:scaleY(0)}}
.line{width:100%;height:auto;display:block}
.donut{width:120px;height:120px;border-radius:50%;position:relative;flex:none}
.donut::after{content:"";position:absolute;inset:26px;border-radius:50%;background:var(--surface)}
.hbar{display:grid;grid-template-columns:110px 1fr 44px;align-items:center;gap:10px;font-size:14px}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots i{width:22px;height:22px;border-radius:7px;background:var(--surface2);display:block}
.dots i.on{background:var(--mint)}
.dots i.today{outline:2px solid var(--primary);outline-offset:1px}

/* badges */
.badge{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;width:96px;flex:none;background:none;border:0;padding:0}
.hex{width:68px;height:76px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);display:grid;place-items:center;font-size:30px;background:var(--bc,var(--primary))}
.badge.locked .hex{background:var(--surface2);filter:grayscale(1);opacity:.6}
.badge span{font-size:12.5px;font-weight:650;line-height:1.2}
.badge.pop .hex{animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.3) rotate(-20deg)}100%{transform:none}}
.badges{display:flex;gap:14px;overflow-x:auto;padding:6px 2px 10px;scrollbar-width:thin}

/* shell */
.shell{min-height:100vh}
.side{display:none}
.mainwrap{min-width:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:10px;padding:12px 16px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.top .brand-m{display:flex;align-items:center;gap:8px}
.main{padding:8px 16px 140px;max-width:1120px;margin:0 auto}
.view-h{margin:10px 0 18px}
.view-h h1{font-size:clamp(28px,5vw,40px)}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.bnav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:650;color:var(--ink2);min-height:52px;border-radius:14px}
.bnav button[aria-current="page"]{color:var(--primary)}
.fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:41;min-height:56px;padding:0 24px;border-radius:999px;border:0;background:var(--primary);color:var(--on-primary);font-weight:750;font-size:16px;display:flex;align-items:center;gap:8px;box-shadow:0 12px 28px -8px rgba(59,75,255,.6)}
.chips-top{display:flex;gap:8px;margin-left:auto;align-items:center}
.stat-chip{display:none;align-items:center;gap:6px;height:40px;padding:0 14px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:14px}
@media(min-width:520px){.stat-chip{display:inline-flex}}
@media(min-width:900px){
  .shell{display:grid;grid-template-columns:260px 1fr}
  .side{display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;padding:22px 16px;border-right:1px solid var(--line);background:var(--surface)}
  .bnav,.fab,.top .brand-m{display:none}
  .main{padding:8px 32px 60px}
  .top{padding:16px 32px}
}
.side .nv{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 14px;border-radius:14px;border:0;background:none;font-weight:650;color:var(--ink2);text-align:left;width:100%}
.side .nv:hover{background:var(--surface2)}
.side .nv[aria-current="page"]{background:var(--primary-soft);color:var(--primary)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:800;font-size:22px;letter-spacing:-.02em;padding:4px 8px 16px}

/* home hero */
.hero-card{background:linear-gradient(135deg,var(--primary) 0%,#5B3BFF 100%);color:#fff;border:0;position:relative;overflow:hidden}
.hero-card::before{content:"";position:absolute;right:-120px;top:-120px;width:340px;height:340px;border-radius:50%;border:34px solid rgba(255,255,255,.07)}
.hero-card::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;border:34px solid rgba(255,255,255,.07)}
.hero-card .muted{color:rgba(255,255,255,.78)}
.hero-card .btn-primary{background:#fff;color:#2a35c8}
.hero-card .rin{color:#fff}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--font-display);font-size:30px;letter-spacing:-.03em;line-height:1}
.ch-item{display:flex;align-items:center;gap:14px;padding:12px;border-radius:var(--r-md);background:var(--surface2)}
.ch-item.done{background:var(--mint-soft)}
.ch-item .em{width:46px;height:46px;border-radius:14px;background:var(--surface);display:grid;place-items:center;font-size:24px;flex:none}
.ch-check{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;color:transparent}
.ch-item.done .ch-check{background:var(--mint);border-color:var(--mint);color:#fff}
.act-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.act-row:last-child{border-bottom:0}
.act-row .em{width:42px;height:42px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;font-size:21px;flex:none}
.mood{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mood button{border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12.5px;font-weight:650;min-height:64px}
.mood button span{font-size:24px}
.mood button[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft)}
.lib-card{cursor:pointer;text-align:left;width:100%;display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px;transition:transform .15s,border-color .15s}
.lib-card:hover{transform:translateY(-2px);border-color:var(--primary)}
.lib-card .em{font-size:30px}
.typegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.typegrid button{border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 6px;min-height:84px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:650;font-size:13px}
.typegrid button span{font-size:26px}
.typegrid button[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft)}

/* leaderboard */
.lb{display:flex;flex-direction:column;gap:8px}
.lb-row{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line)}
.lb-row.me{background:var(--primary-soft);border-color:var(--primary)}
.lb-rank{font-family:var(--font-display);font-weight:800;font-size:20px;text-align:center}
.lb-row .meta{font-size:12.5px;color:var(--ink2);display:flex;gap:10px;flex-wrap:wrap}
.lb-pts{font-family:var(--font-display);font-weight:800;font-size:20px;text-align:right}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff;flex:none}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}
.tbl th{font-size:12.5px;color:var(--ink2);font-weight:650}
.tbl-wrap{overflow-x:auto}

/* chat */
.chat{display:flex;flex-direction:column;gap:12px;max-height:52vh;overflow:auto;padding:4px 2px}
.msg{max-width:88%;padding:12px 16px;border-radius:20px;font-size:15px}
.msg.ai{background:var(--surface2);border-bottom-left-radius:6px;align-self:flex-start}
.msg.me{background:var(--primary);color:var(--on-primary);border-bottom-right-radius:6px;align-self:flex-end}
.plan{margin-top:10px;background:var(--surface);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;color:var(--ink)}
.typing i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ink2);margin:0 2px;animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

/* layers */
.scrim{position:fixed;inset:0;z-index:100;background:rgba(8,12,32,.6);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:24px 22px calc(28px + env(safe-area-inset-bottom,0px));animation:up .3s cubic-bezier(.2,.9,.3,1)}
@media(min-width:700px){.scrim{align-items:center}.sheet{border-radius:28px;padding-bottom:28px}}
.sheet.wide{max-width:820px}
.sheet .x{position:sticky;top:0;float:right;margin:-8px -8px 0 0}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
#toasts{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 12px);z-index:150;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 12px}
.toast{background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:650;font-size:14.5px;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);animation:toast .35s cubic-bezier(.2,1.4,.4,1);display:flex;gap:8px;align-items:center}
@keyframes toast{from{transform:translateY(-20px) scale(.9);opacity:0}}
.banner{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 66px);z-index:60;max-width:640px;margin:0 auto;background:var(--surface);border:2px solid var(--mint);border-radius:22px;padding:16px;box-shadow:0 20px 40px -16px rgba(0,0,0,.4);animation:toast .4s cubic-bezier(.2,1.4,.4,1)}
.confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:160;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.9}}
.notif{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.notif:last-child{border:0}
.notif .em{width:38px;height:38px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;flex:none}
.notif.unread .em{background:var(--primary-soft)}
.timer-big{font-family:var(--font-display);font-size:54px;font-weight:800;letter-spacing:-.04em}
.step-li{display:flex;gap:12px;align-items:flex-start}
.step-li b{width:26px;height:26px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-size:13px;flex:none}
.dir-item{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.dir-item:last-child{border:0}
.dir-n{width:30px;height:30px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.dir-item.ok .dir-n{background:var(--mint);color:#04140e}

/* landing */
.land{overflow-x:clip}
.l-nav{display:flex;align-items:center;justify-content:space-between;max-width:1160px;margin:0 auto;padding:16px 20px}
.l-hero{position:relative;max-width:1160px;margin:0 auto;padding:36px 20px 70px;display:grid;gap:40px;align-items:center}
@media(min-width:900px){.l-hero{grid-template-columns:1.15fr .85fr;padding-top:60px}}
.l-hero h1{font-size:clamp(46px,9vw,92px);font-weight:800;line-height:.98;letter-spacing:-.045em}
.l-hero h1 span{display:block}
.l-sub{font-size:clamp(17px,2.4vw,21px);color:var(--ink2);max-width:34em;margin:22px 0 30px}
.lanes{position:absolute;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.lanes svg{position:absolute;right:-18%;top:-40%;width:110%;opacity:.5}
.phone{width:min(100%,340px);margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:40px;padding:22px;box-shadow:0 30px 60px -24px rgba(59,75,255,.45);display:flex;flex-direction:column;gap:14px}
.phone .li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--surface2);font-weight:600;font-size:14px;transition:background .3s}
.phone .li i{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent;font-style:normal;font-size:13px;transition:all .3s;flex:none}
.phone .li.done{background:var(--mint-soft)}
.phone .li.done i{background:var(--mint);border-color:var(--mint);color:#fff}
.ptspop{position:absolute;right:16px;top:10px;font-weight:800;color:var(--flame);opacity:0;transition:all .5s}
.ptspop.on{opacity:1;transform:translateY(-10px)}
.sect{max-width:1160px;margin:0 auto;padding:60px 20px}
.sect h2{font-size:clamp(30px,5vw,48px);max-width:16em}
.sect .lead{color:var(--ink2);margin-top:12px;max-width:40em;font-size:17px}
.pfip{display:grid;gap:0;margin-top:30px;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--surface)}
@media(min-width:800px){.pfip{grid-template-columns:repeat(4,1fr)}}
.pfip>div{padding:26px;border-bottom:1px solid var(--line)}
@media(min-width:800px){.pfip>div{border-bottom:0;border-right:1px solid var(--line)}.pfip>div:last-child{border-right:0}}
.pfip h3{font-size:22px;margin-bottom:8px}
.feat{display:flex;flex-direction:column;gap:10px}
.feat .em{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:26px}
.steps6{display:grid;gap:14px;margin-top:30px;counter-reset:s}
@media(min-width:800px){.steps6{grid-template-columns:repeat(3,1fr)}}
.steps6>div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:20px;position:relative}
.steps6 b{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--primary);color:var(--on-primary);font-family:var(--font-display);margin-bottom:12px}
.l-foot{max-width:1160px;margin:0 auto;padding:30px 20px 60px;color:var(--ink2);font-size:14px;border-top:1px solid var(--line)}

/* auth / onboarding */
.center-page{min-height:100vh;display:grid;place-items:center;padding:20px}
.auth-card{width:100%;max-width:480px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:14px 16px;min-height:56px;font-weight:600}
.opt[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft)}
.opt .em{font-size:22px}
.prog{display:flex;gap:6px;margin-bottom:22px}
.prog i{flex:1;height:6px;border-radius:9px;background:var(--surface2)}
.prog i.on{background:var(--primary)}
.err{color:var(--rose);font-size:14px;font-weight:600}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}

/* ---------- challenges ---------- */
function adapt(){
  let off=0,done=0;for(let i=1;i<=7;i++){const k=dk(addD(new Date(),-i));if(S.offered[k]){off+=S.offered[k];done+=(S.cdone[k]||[]).length;}}
  if(off<6)return {f:1,label:'Starter',note:'Your challenges will adapt as you complete them.'};
  const r=done/off;
  if(r>=.8)return {f:1.25,label:'Stretch',note:'You completed most challenges last week, so today is a little bigger.'};
  if(r<.4)return {f:.75,label:'Gentle',note:'Last week was busy, so today is a little lighter.'};
  return {f:1,label:'Steady',note:'Based on your last 7 days, today stays at a steady level.'};
}
function genDaily(k){
  const r=rng(hashS(k+S.user.nick)),ad=adapt(),tags=prefTags(),mood=S.mood[k];
  const list=POOL.map(c=>{let s=r()*1.1;
    if(c.tags.some(t=>tags.has(t)))s+=1.3;
    if(S.user.env==='Indoor'&&c.out)s-=2.5; if(S.user.env==='Outdoor'&&c.out)s+=.8;
    if(mood==='tired'&&['cycle','outdoor','pushups'].includes(c.id))s-=2.5;
    if(mood==='great'&&['outdoor','cycle'].includes(c.id))s+=.6;
    if(S.user.minutes<=10&&c.unit==='min'&&c.base>=15)s-=1.5;
    if(c.id==='break')s-=.3;return {c,s};}).sort((a,b)=>b.s-a.s);
  const picks=[];const seenType=new Set();
  for(const x of list){if(picks.length>=3)break;if(seenType.has(x.c.type)&&picks.length<2)continue;picks.push(x.c);seenType.add(x.c.type);}
  for(const x of list){if(picks.length>=3)break;if(!picks.includes(x.c))picks.push(x.c);}
  const g=mood==='tired'?.75:1;
  const out=picks.map((c,i)=>{const n=Math.max(5,Math.round(c.base*ad.f*g/(c.unit==='reps'?1:1)));const mins=c.unit==='reps'?c.mins(n):n;

    return {id:c.id,title:c.t(n),type:c.type,mins,pts:30+(ad.f>1?10:0),e:c.e,why};});
  return out;
}

/* ---------- logging ---------- */
function logActivity({type,min,dist=null,date=TODAY(),src='manual',note='',quiet=false}){

}

/* ---------- messaging engines ---------- */
function motivation(){
  const st=streak(),k=TODAY(),today=minsOn(k),rem=Math.max(0,S.user.weeklyGoal-weekMins());
  const last=S.acts.length?S.acts.map(a=>a.date).sort().pop():null;

  const mood=S.mood[k];
  if(!S.acts.length)return 'Start with a 10-minute walk. Small steps count and every activity earns points.';
  if(rem>0&&rem<=25)return 'Only '+rem+' minutes to go to reach this week\'s goal. One more activity does it.';
  if(rem===0)return 'You reached this week\'s goal. Anything extra is a bonus, and rest is part of the plan too.';
  if(today===0&&st>=2)return 'Your '+st+'-day streak is still active. A short activity today keeps it going.';

const LBL={walking:['brisk walk','brisk walking'],running:['easy jog','easy jogging'],cycling:['relaxed ride','relaxed cycling'],sports:['game of your choice','sport play'],gym:['bodyweight strength circuit','bodyweight strength work'],yoga:['stretching session','stretching'],other:['movement session','movement']};
function pickMain(o){

  if(!cand.length)cand=(o.env==='Indoor'||S.user.env==='Indoor')?['yoga']:['walking'];
  const c=typeCounts(7);return [...cand].sort((a,b)=>(c[a]||0)-(c[b]||0))[0];
}
function coachPlan(mins,o={}){
  const main=o.type||pickMain(o);let b;
  if(o.gentle){const w=Math.max(5,Math.round(mins*.6));b=mins<=10?[{type:'yoga',min:mins}]:[{type:'walking',min:w},{type:'yoga',min:Math.max(5,mins-w)}];}

  else if(mins<=10)b=[{type:main,min:mins}];
  else if(mins<=25){const s=mins>=15?5:Math.round(mins/3);b=[{type:main,min:mins-s},{type:'yoga',min:s}];}
  else b=[{type:'yoga',min:5},{type:main,min:mins-10},{type:'yoga',min:5}];

}
function planText(b){

  if(b.length===2)return 'Try a '+b[0].min+'-minute '+LBL[b[0].type][0]+' followed by '+b[1].min+' minutes of '+LBL[b[1].type][1]+'.';

}
function coachReply(q){

  mins=clamp(mins,5,90);

  if(/walk|stroll/.test(m))o.type='walking';else if(/run|jog/.test(m))o.type='running';else if(/cycl|bike|ride/.test(m))o.type='cycling';
  else if(/yoga|stretch|mobil/.test(m))o.type='yoga';else if(/strength|squat|push|gym|weights/.test(m))o.type='gym';else if(/sport|badminton|football|cricket|tennis/.test(m))o.type='sports';
  if(/indoor|inside|room|hostel|rain/.test(m))o.env='Indoor';

function ring(pct,o={}){const size=o.size||140,sw=o.sw||12,color=o.color||'var(--primary)',track=o.track||'var(--surface2)';const r=(size-sw)/2,c=2*Math.PI*r,p=clamp(pct,0,1);

function lineChart(vals,labels){const W=320,H=130,p=14,max=Math.max(...vals,1);const pts=vals.map((v,i)=>[p+i*(W-2*p)/Math.max(1,vals.length-1),H-22-(v/max)*(H-44)]);
  const d=pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');const lp=pts[pts.length-1],fp=pts[0];
  return '<svg viewBox="0 0 '+W+' '+H+'" class="line" role="img" aria-label="Weekly activity minutes, last '+vals.length+' weeks"><path d="'+d+' L'+lp[0]+' '+(H-22)+' L'+fp[0]+' '+(H-22)+'Z" fill="var(--primary)" opacity=".13"/><path d="'+d+'" fill="none" stroke="var(--primary)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>'+pts.map((q,i)=>'<circle cx="'+q[0]+'" cy="'+q[1]+'" r="'+(i===pts.length-1?5:3)+'" fill="var(--primary)"/>').join('')+labels.map((l,i)=>'<text x="'+pts[i][0]+'" y="'+(H-4)+'" text-anchor="middle" font-size="9.5" fill="var(--ink2)">'+esc(l)+'</text>').join('')+'</svg>';}

async function pwHash(p){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('fq:'+p));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}catch(e){return 'x'+hashS(p);}}
async function authSubmit(){
  const v=id=>($('#'+id)||{}).value||'';const email=v('a-email').trim().toLowerCase(),pw=v('a-pw');
  const acc=store.get('fq_accounts')||{};ui.authErr='';
  if(!/^\S+@\S+\.\S+$/.test(email))ui.authErr='Enter a valid email address.';
  else if(pw.length<6)ui.authErr='Password needs at least 6 characters.';
  if(!ui.authErr){
    const h=await pwHash(pw);
    if(ui.authTab==='signup'){
      const nick=v('a-nick').trim();
      if(nick.length<3)ui.authErr='Choose a nickname with at least 3 characters.';
      else if(!v('a-name').trim()||!v('a-school').trim())ui.authErr='Full name and School/College are required.';
      else if(nick.length>18)ui.authErr='Nickname can be at most 18 characters.';
      else if(acc[email]){ui.authErr='This email already has an account. Please log in or reset your password.';ui.dupe=1;}
      else{acc[email]={h};store.set('fq_accounts',acc);SESSION=email;store.set('fq_session',email);
        S=newState({name:v('a-name').trim(),nick,school:v('a-school').trim(),email});schoolize(S);ui.ob={prefs:[]};ui.obStep=0;save();go('onboard');return;}
    }else{
      if(!acc[email]||acc[email].h!==h)ui.authErr='Email or password is not correct.';
      else{SESSION=email;store.set('fq_session',email);S=store.get('fq_data_'+email);if(S)schoolize(S);
        if(!S){ui.authErr='No saved data found for this account.';}
        else{ui.chat=null;go(S.user.onboarded?'home':'onboard');return;}}
    }
  }
  const e=$('#a-err');if(e){e.textContent=ui.authErr;if(ui.dupe){ui.dupe=0;e.insertAdjacentHTML('beforeend','<div class="row" style="gap:8px;margin-top:8px"><button class="btn btn-sm btn-primary" data-act="authTab" data-v="login">Log In</button><button class="btn btn-sm btn-line" data-act="forgot">Forgot Password</button></div>');}}
}

function vInsights(){
  const from=dk(addD(new Date(),-28)),A=S.acts.filter(a=>a.date>=from);
  if(!S.acts.length)return '<div class="view-h"><h1>My Insights</h1></div><div class="empty">Log a few activities to see your patterns. Insights appear after your first activity.</div>';
  const byDow=[0,0,0,0,0,0,0],cnt=[0,0,0,0,0,0,0];
  for(let i=0;i<28;i++){const d=addD(new Date(),-i);cnt[d.getDay()]++;}
  A.forEach(a=>{byDow[parseK(a.date).getDay()]+=a.min;});
  const avgDow=byDow.map((v,i)=>Math.round(v/Math.max(1,cnt[i])));
  const order=[1,2,3,4,5,6,0],dv=order.map(i=>avgDow[i]),dl=order.map(i=>DOW[i].slice(0,3));
  const topI=avgDow.indexOf(Math.max(...avgDow)),topPos=order.indexOf(topI);
  const weeks=[],wl=[];for(let w=7;w>=0;w--){const s=addD(weekStart(),-7*w);let sum=0;for(let i=0;i<7;i++)sum+=minsOn(dk(addD(s,i)));weeks.push(sum);wl.push(w===0?'Now':s.getDate()+' '+MON[s.getMonth()]);}
  let off=0,dn=0;for(let i=0;i<14;i++){const k=dk(addD(new Date(),-i));if(S.offered[k]){off+=S.offered[k];dn+=(S.cdone[k]||[]).length;}}
  const rate=off?Math.round(dn/off*100):0;
  let woff=0,wdn=0;for(let i=0;i<7;i++){const k=dk(addD(weekStart(),i));if(S.offered[k]){woff+=S.offered[k];wdn+=(S.cdone[k]||[]).length;}}
  const wrate=woff?Math.round(wdn/woff*100):null;
  const tc=typeCounts(28),tk=Object.keys(tc).sort((a,b)=>tc[b]-tc[a]),tsum=tk.reduce((s,k)=>s+tc[k],0);
  const avg=A.length?Math.round(A.reduce((s,a)=>s+a.min,0)/A.length):0;
  const bd=[];for(let i=13;i>=0;i--)bd.push(S.breaks.includes(dk(addD(new Date(),-i))));
  const bn=bd.filter(Boolean).length;
  const weekend=(avgDow[0]+avgDow[6])>=(avgDow[1]+avgDow[2]+avgDow[3]+avgDow[4]+avgDow[5])/2.5&&(topI===0||topI===6);
  const lines=[];
  lines.push(weekend?'You were most active on weekends.':'You were most active on '+DOWF[topI]+'.');
  if(wrate!==null)lines.push('You completed '+wrate+'% of your challenges this week.');
  lines.push('Your current streak is '+streak()+' '+(streak()===1?'day':'days')+'.');
  if(tk.length)lines.push(TYPES[tk[0]].n+' is your most frequent activity: '+tc[tk[0]]+' of '+tsum+' sessions in the last 4 weeks.');
  lines.push('You took a StudyBreak on '+bn+' of the last 14 days.');
  const c=[TYPES,0];const donutColors=['#3B4BFF','#0FA57A','#FFB800','#E8489B','#8A5CF6','#12A4C8','#FF6B3D'];
  let acc=0;const conic=tk.map((k,i)=>{const p=tc[k]/tsum*100;const s=donutColors[i%7]+' '+acc+'% '+(acc+p)+'%';acc+=p;return s;}).join(',');
  return '<div class="view-h"><h1>My Insights</h1><p class="muted">Simple patterns from your own activity. These are not medical advice.</p></div>'
  +'<section class="card"><h3 style="margin-bottom:10px">What we noticed</h3><div class="stack" style="gap:8px">'+lines.map(l=>'<div class="row" style="gap:10px;align-items:flex-start"><span style="color:var(--primary);margin-top:3px">'+ico('spark',16)+'</span><span>'+esc(l)+'</span></div>').join('')+'</div></section>'
  +'<div class="grid g2" style="margin-top:16px"><section class="card"><h3>Most active days</h3><p class="small muted">Average minutes per day, last 4 weeks</p>'+bars(dv,dl,{hi:topPos,h:100,label:'Average minutes by weekday'})+'</section>'
  +'<section class="card"><h3>Weekly activity trend</h3><p class="small muted">Minutes per week, last 8 weeks</p>'+lineChart(weeks,wl)+'</section></div>'
  +'<div class="grid g4" style="margin-top:16px"><div class="card sm"><div class="row" style="gap:14px">'+ring(rate/100,{size:76,sw:9,color:'var(--mint)',inner:'<b style="font-size:16px">'+rate+'%</b>'})+'<div><b>Challenge completion</b><div class="tiny muted">last 14 days</div></div></div></div>'
  +'<div class="card sm"><div class="stat"><b style="color:var(--flame)">'+streak()+'</b><span class="small muted">current streak (days)</span></div></div>'
  +'<div class="card sm"><div class="stat"><b>'+avg+' min</b><span class="small muted">average activity duration</span></div></div>'
  +'<div class="card sm"><div class="stat"><b>'+Math.round(A.reduce((s,a)=>s+a.min,0)/4)+' min</b><span class="small muted">average per week</span></div></div></div>'
  +'<div class="grid g2" style="margin-top:16px"><section class="card"><h3 style="margin-bottom:12px">Preferred activities</h3><div class="row" style="gap:20px;align-items:center"><div class="donut" style="background:conic-gradient('+(conic||'var(--surface2) 0 100%')+')" role="img" aria-label="Activity mix"></div><div class="stack grow" style="gap:6px">'+tk.slice(0,5).map((k,i)=>'<div class="row" style="gap:8px;font-size:14px"><i style="width:12px;height:12px;border-radius:4px;background:'+donutColors[i%7]+';display:block"></i><span class="grow">'+TYPES[k].n+'</span><b>'+Math.round(tc[k]/tsum*100)+'%</b></div>').join('')+'</div></div></section>'
  +'<section class="card"><h3>Study-break consistency</h3><p class="small muted" style="margin-bottom:12px">Last 14 days. Filled means you took a break.</p><div class="dots" role="img" aria-label="'+bn+' of 14 days with a StudyBreak">'+bd.map((b,i)=>'<i class="'+(b?'on':'')+(i===13?' today':'')+'"></i>').join('')+'</div><p style="margin-top:12px"><b>'+Math.round(bn/14*100)+'%</b> <span class="muted">of days</span></p></section></div>';
}

function afterRender(){
  $$('[data-count]').forEach(n=>{const to=+n.dataset.count,key=n.dataset.key,from=prev[key]!=null?prev[key]:to;prev[key]=to;
    if(from!==to&&!matchMedia('(prefers-reduced-motion: reduce)').matches){const t0=performance.now();const step=t=>{const p=clamp((t-t0)/900,0,1);const v=Math.round(from+(to-from)*(1-Math.pow(1-p,3)));n.textContent=v.toLocaleString();if(p<1)requestAnimationFrame(step);};requestAnimationFrame(step);}});
  if(route==='coach')paintChat();
}

/* ---- FITQUEST score (activity-only, non-medical) ---- */
function fqScore(){const wk=weekDays().reduce((a,b)=>a+b,0),g=S.user.weeklyGoal||150;let d14=0;for(let i=0;i<14;i++)if(minsOn(dk(addD(new Date(),-i)))>0)d14++;
 const c={Consistency:d14/14,'Active minutes':Math.min(1,wk/g),Challenges:Math.min(1,chTotal()/30),Streak:Math.min(1,streak()/14),Participation:Math.min(1,(Object.keys(S.camp).length+S.acts.length/10)/5)};
 const w=[.3,.25,.15,.15,.15];const sc=Math.round(Object.values(c).reduce((s,v,i)=>s+v*w[i],0)*100);return{sc,c,wk,g,pct:Math.min(1,wk/g)};}
const monthPts=()=>{const f=dk(addD(new Date(),-30));return S.ledger.filter(l=>l.d>=f&&l.pts>0).reduce((s,l)=>s+l.pts,0);};
function scoreCard(){const f=fqScore();return '<section class="card"><h3>💯 FITQUEST Score</h3><div class="row wrap" style="gap:18px;margin-top:10px">'+ring(f.sc/100,{size:120,sw:12})+'<div class="grow"><b style="font-size:34px;font-family:var(--font-display)">'+f.sc+' / 100</b><div class="stack" style="gap:6px;margin-top:6px">'+Object.entries(f.c).map(([k,v])=>'<div class="small"><span class="muted">'+k+'</span><div class="pbar"><i style="width:'+Math.round(v*100)+'%"></i></div></div>').join('')+'</div></div></div><p class="tiny muted" style="margin-top:10px">Your Fitness Score reflects your activity and consistency. It is not a medical score.</p></section>';}
/* ---- AI personal plan (rule-based, local) ---- */
function buildPlan(){const u=S.user,m=u.minutes||20,prefs=u.prefs||[],seed=ui.planSeed||0,out=/outdoor/i.test(u.env),ind=/indoor/i.test(u.env);
 const easy=/seated|light/i.test(u.level||'')||streak()<3;const map={Walking:'walking',Running:'running',Cycling:'cycling',Sports:'sports','Yoga & stretching':'yoga',Gym:'gym'};
 let mainT=(prefs.map(p=>map[p]).filter(Boolean)).filter(t=>!(ind&&['running','cycling'].includes(t)))[seed%Math.max(1,prefs.length)]||(ind?'yoga':'walking');
 const a=Math.round(m*.5),b=Math.round(m*.25),c=Math.max(1,m-a-b);
 return{mins:m,pts:Math.min(100,10+a)+Math.min(100,10+b)+Math.min(100,10+c),blocks:[{type:mainT,min:a,l:easy?'easy pace':'steady pace'},{type:'yoga',min:b,l:'stretching'},{type:easy?'walking':'other',min:c,l:'light activity'}]};}

/* ---- profile helpers, nav, demo ---- */
A.privSet=()=>{toast('Privacy and notification switches are in the Profile page below');};
NAV.splice(5,0,['rewards','Rewards','spark']);
document.head.insertAdjacentHTML('beforeend','<style>.pbar{height:8px;border-radius:8px;background:var(--surface2);overflow:hidden;margin:6px 0}.pbar i{display:block;height:100%;background:var(--primary);border-radius:8px;transition:width .6s}.livedot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#0FA57A;animation:lv 1.4s infinite}@keyframes lv{50%{opacity:.25}}.bnav{overflow-x:auto}.bnav button{min-width:64px}#demoTag{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:999;background:#E8489B;color:#fff;padding:6px 14px;border-radius:99px;font-weight:700;font-size:13px}.sheet.wide{max-width:720px}@media(prefers-reduced-motion:reduce){.livedot{animation:none}.pbar i{transition:none}}</style>');
A.runDemo=async()=>{if(window._dm)return;window._dm=1;const tag=document.createElement('div');tag.id='demoTag';tag.textContent='🎬 DEMO MODE';document.body.appendChild(tag);
 const step=async(m,r,ms=2600)=>{toast(m);if(r)go(r);await sleep(ms);};
 try{startSession(true);await sleep(600);await step('1/10 Student dashboard','home');await step('2/10 AI recommendation ready','home');
 await step('3/10 Starting activity: 20-min walk','activities',1800);
 logActivity({type:'walking',min:20,src:'manual',quiet:true});await step('4/10 Activity completed','home',1800);
 addPts(50,'Demo bonus');notify('⭐ You earned 50 points!','spark');await step('5/10 +50 points earned','home',1800);
 S.badges.streak7={d:TODAY()};confetti();notify('🔥 7-day streak achieved!','flame');await step('6/10 Badge unlocked: 7-Day Streak','profile');
 await step('7/10 FITQUEST Score updated: '+fqScore().sc,'home');
 bumpPeers(3,20,50);lbUpdated=Date.now();await step('8/10 Leaderboard updated live','leaderboard',3000);
 await step('9/10 Reward Center','rewards',3000);await step('10/10 Monthly analytics','insights',3000);toast('Demo finished. Thank you! 🎉');}
 finally{tag.remove();window._dm=0;}};

/* ---------- boot ---------- */
(function boot(){
  const th=store.get('fq_theme');if(th)document.documentElement.dataset.theme=th;
  const sess=store.get('fq_session');
  if(sess){const d=store.get('fq_data_'+sess);if(d&&d.user){S=d;schoolize(S);SESSION=sess;route=d.user.onboarded?'home':'onboard';if(route==='onboard'){ui.ob={prefs:[]};}
    if(!S.set)S.set=DEFAULT_SET();dailyChallenges();}}
  render();
})();
</script>
